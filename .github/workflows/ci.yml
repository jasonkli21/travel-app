name: CI

on:
  push:
  pull_request:

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 scripts/check_markdown_links.py

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked --project backend
      - name: Export the locked Python dependency graph
        run: uv export --project backend --locked --all-groups --format requirements-txt --no-emit-project --output-file "$RUNNER_TEMP/travel-python-audit.txt" > /dev/null
      - name: Audit the locked Python dependency graph
        run: uv run --project backend --locked pip-audit --requirement "$RUNNER_TEMP/travel-python-audit.txt" --require-hashes --disable-pip
      - name: Scan tracked repository files for new secrets
        run: git ls-files -z | xargs -0 uv run --project backend --locked detect-secrets-hook --baseline .secrets.baseline

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: travel_test
          POSTGRES_USER: travel
          POSTGRES_PASSWORD: travel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U travel -d travel_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgresql+psycopg://travel:travel@127.0.0.1:5432/travel_test
      DATABASE_URL: postgresql+psycopg://travel:travel@127.0.0.1:5432/travel_test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked mypy src
      - run: uv run --locked pytest
      - run: uv build --out-dir /tmp/personal-travel-api-dist
      - run: uv run --locked alembic upgrade head
      - run: uv run --locked alembic check
      - run: uv run --locked alembic downgrade base
      - run: uv run --locked alembic upgrade head

  recovery:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: travel
          POSTGRES_PASSWORD: travel
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U travel -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - name: Verify encrypted PostgreSQL and private-store recovery
        env:
          PGPASSWORD: travel
          RECOVERY_SOURCE_DATABASE_URL: postgresql+psycopg://travel:travel@localhost:5432/travel_recovery_source
          RECOVERY_RESTORE_DATABASE_URL: postgresql+psycopg://travel:travel@localhost:5432/travel_recovery_restore
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes age
          createdb --host localhost --username travel --maintenance-db postgres travel_recovery_source
          createdb --host localhost --username travel --maintenance-db postgres travel_recovery_restore
          cleanup() {
            dropdb --if-exists --host localhost --username travel --maintenance-db postgres travel_recovery_restore
            dropdb --if-exists --host localhost --username travel --maintenance-db postgres travel_recovery_source
          }
          trap cleanup EXIT
          DATABASE_URL="$RECOVERY_SOURCE_DATABASE_URL" uv run --locked alembic upgrade head
          uv run --locked python -m scripts.recovery_smoke

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: corepack enable
      - run: corepack prepare pnpm@10.17.1 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level=high
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Build API image
        run: docker build --tag personal-travel-api:ci ./backend
      - name: Build web image
        run: docker build --tag personal-travel-web:ci ./frontend
      - name: Smoke test non-root API image
        shell: bash
        run: |
          set -euo pipefail
          test "$(docker image inspect --format='{{.Config.User}}' personal-travel-api:ci)" = "10001:10001"
          docker run --detach --rm --name travel-api-ci \
            --publish 127.0.0.1:18080:8080 \
            --env TRAVEL_DEPLOYMENT_MODE=local \
            --env ALLOWED_HOSTS=127.0.0.1 \
            personal-travel-api:ci
          cleanup() { docker stop travel-api-ci >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18080/health >/dev/null; then
              docker image inspect --format='API image {{.Id}}' personal-travel-api:ci
              exit 0
            fi
            sleep 1
          done
          docker logs travel-api-ci
          exit 1
      - name: Smoke test non-root web image
        shell: bash
        run: |
          set -euo pipefail
          test "$(docker image inspect --format='{{.Config.User}}' personal-travel-web:ci)" = "node"
          docker run --detach --rm --name travel-web-ci \
            --publish 127.0.0.1:13000:8080 \
            --env TRAVEL_DEPLOYMENT_MODE=local \
            --env TRAVEL_WEB_ALLOWED_HOSTS=127.0.0.1 \
            personal-travel-web:ci
          cleanup() { docker stop travel-web-ci >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:13000/ >/dev/null; then
              docker image inspect --format='Web image {{.Id}}' personal-travel-web:ci
              exit 0
            fi
            sleep 1
          done
          docker logs travel-web-ci
          exit 1
